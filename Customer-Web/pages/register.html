<!DOCTYPE html>
<html lang="en">
 <head>
    <link rel="icon" type="image/x-icon" href="../../image/icon/favicon.png">
    <meta charset="UTF-8">
    <meta name="author" content="Tsoeu Thabiso Andrew"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trend Heaven | Register</title>
    <link rel="stylesheet" href="../style/register.css">
 </head>

 <body>

   <div class="register-container">
     <h1>TREND HEAVEN</h1>
     <h2>Create Your Account</h2>

     <form method="POST">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter Names"  >

        <label for="surname">Surname</label>
        <input type="text" id="surname" placeholder="Enter Surname"  >

        <label for="gender">Gender</label>
        <select id="gender"  >
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
        </select>

        <label for="date_of_birth">Date of Birth</label>
        <input type="date" id="date_of_birth"  >

        <label for="CustomerID">Identity Number</label>
        <input type="text" id="CustomerID" placeholder="Enter your ID number"  >

        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile_number" placeholder="Enter your mobile number"  >

        <label for="address">Address</label>
        <textarea id="address" placeholder="Enter your address" rows="4"  ></textarea>

        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Choose a username"  >

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email"  >

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password"  >

        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" placeholder="Confirm your password"  >

        <button type="submit">CREATE ACCOUNT</button>
     </form>

      <p>Already have an account?</p>

      <a href="login.html" class="login">Login</a>

    </div>

 </body>
</html>
